[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-gap_engine"
version = "0.1.0"
description = "Sentinel Gap Engine Sidecar Service"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
